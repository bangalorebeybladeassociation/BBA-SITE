<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0D18" />
    <title>Offline · BBA</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0A0D18; color: #E8ECF5; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; box-sizing: border-box; text-align: center; }
      img { width: 120px; height: 120px; }
      h1 { margin: 0; font-size: 22px; }
      p { margin: 0; max-width: 320px; color: #9AA3B8; line-height: 1.5; }
      button { margin-top: 8px; padding: 12px 24px; border: 0; border-radius: 999px; background: #00E6C3; color: #0A0D18; font-weight: 600; font-size: 15px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Brackets, events and the marketplace need a connection. Check your internet and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
